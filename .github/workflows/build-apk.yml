name: Build UNIVERSE MUSIC APK

on:
  # APK builds remain manual-only after the one-time validation build.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UNIVERSE MUSIC
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build QuackJS locally with SDK 36
        run: |
          git clone --depth 1 https://github.com/MetrolistGroup/quackjs.git /tmp/quackjs
          cd /tmp/quackjs
          grep -RIl 'compileSdk.*37' . --include='*.kts' --include='*.toml' | xargs -r sed -i -E 's/compileSdk = "37"/compileSdk = "36"/g; s/compileSdk = 37/compileSdk = 36/g'
          # Keep QuackJS on the same Android Gradle Plugin version as InnerTubeX.
          grep -RIl '9\.5\.0' . --include='*.kts' --include='*.toml' | xargs -r sed -i 's/9\.5\.0/9.4.1/g'
          grep -RIn '9\.5\.0' . --include='*.kts' --include='*.toml' || true
          grep -RIn 'compileSdk.*37' . --include='*.kts' --include='*.toml' || true
          gradle publishToMavenLocal --stacktrace

      - name: Build compatible InnerTubeX from source
        run: |
          git clone --depth 1 https://github.com/MetrolistGroup/innertubex.git /tmp/innertubex
          cd /tmp/innertubex
          sed -i 's/compileSdk = "37"/compileSdk = "36"/' gradle/libs.versions.toml
          # The upstream version catalog explicitly pins AGP 9.5.0; align it with QuackJS.
          sed -i 's/androidGradlePlugin = "9.5.0"/androidGradlePlugin = "9.4.1"/' gradle/libs.versions.toml
          grep -n 'androidGradlePlugin' gradle/libs.versions.toml
          grep -RIn '9\.5\.0' . --include='*.kts' --include='*.toml' || true
          gradle -PuseLocalQuackJS publishToMavenLocal --stacktrace

      - name: Show build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universe-music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
